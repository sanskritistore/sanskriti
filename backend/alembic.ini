# एलेम्बिक कॉन्फ़िगरेशन - माइग्रेशन उपकरण
# (Hindi: डेटाबेस स्कीमा परिवर्तनों को संस्करणित करता है)

[alembic]
script_location = alembic
# डेटाबेस URL env.py से आता है (settings.DATABASE_URL)
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
