<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>कोई इंटरनेट नहीं — Sanskriti</title>
  <style>
    body {
      font-family: "Noto Sans Devanagari", system-ui, sans-serif;
      background: #fff7ed;
      color: #7c2d12;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      margin: 0;
    }
    .box { max-width: 400px; }
    .icon { font-size: 3rem; }
    h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
    p { color: #9a3412; line-height: 1.6; }
    button {
      margin-top: 1.5rem;
      background: #f97316;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📴</div>
    <h1>इंटरनेट कनेक्शन नहीं है</h1>
    <p>No internet connection.<br />कृपया अपना इंटरनेट चेक करें और फिर कोशिश करें।</p>
    <button onclick="location.reload()">फिर कोशिश करें (Retry)</button>
  </div>
</body>
</html>
